name: Build and Deploy (GHCR + EC2)

on:
  push:
    branches:
      - main
      - Lewis
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/eduback

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        run: |
          IMG=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # The Spring project lives in the EP/ subfolder of the repo.
          context: ./EP
          file: ./EP/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          envs: APP_IMAGE
          script: |
            set -euo pipefail
            APP_DIR="/opt/edupoa"
            cd "$APP_DIR"

            # Authenticate to GHCR so the server can pull the image.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export APP_IMAGE="$APP_IMAGE"

            # Reclaim disk before pulling (small instance). Only remove the build cache and
            # DANGLING (untagged) images. We intentionally do NOT use "prune -af", because that
            # removes every image not attached to a running container - including the separately
            # managed frontend image (ghcr.io/lewis45-sheriff/edupoa-frontend:latest).
            docker builder prune -af || true
            docker image prune -f || true

            # Pull and (re)start ONLY the backend stack services. No --remove-orphans:
            # the frontend container belongs to the same compose project but a different
            # compose file, so --remove-orphans would delete it.
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d app db nginx

            # Reclaim disk from OLD backend images only, matched by repository name.
            # Keep the image the backend container is currently running; delete the rest of
            # that repository's images. This never touches the frontend image or any other repo.
            BACKEND_REPO="${APP_IMAGE%:*}"
            CURRENT_ID="$(docker inspect --format '{{.Image}}' edupoa-backend 2>/dev/null || true)"
            if [ -n "$CURRENT_ID" ]; then
              docker images "$BACKEND_REPO" --no-trunc --format '{{.ID}}' \
                | sort -u \
                | grep -v -F "$CURRENT_ID" \
                | xargs -r docker rmi -f || true
            else
              echo "Backend container not found; skipping old-image cleanup to avoid removing the new image."
            fi

            echo "--- backend stack ---"
            docker compose -f docker-compose.prod.yml ps
            echo "--- frontend (left untouched) ---"
            docker compose -f docker-compose.frontend.yml ps || true
            echo "Deployment completed."
